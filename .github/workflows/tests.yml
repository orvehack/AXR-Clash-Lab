name: AXR test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run local environment diagnostic
        run: python -m src.doctor
      - name: Validate training plan without ML dependencies
        run: python -m src.train_agent --plan-only --steps 1000 --save-dir runs/ci_preflight
      - name: Validate imitation plan without downloading replays
        run: python -m src.imitate_agent --plan-only --matches 5 --out-dir runs/ci_imitation_preflight
      - name: Check CLI entry points
        run: |
          python -m src.royalegym_baseline --help
          python -m src.registry_bridge --help
